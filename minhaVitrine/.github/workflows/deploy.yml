name: Minha Vitrine - CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ubuntu
  EC2_KEY: ${{ secrets.EC2_SSH_KEY }}

jobs:
  # ============================
  # 1. TESTES DO BACKEND
  # ============================
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Rodar testes
        run: cd backend && mvn test -B

  # ============================
  # 2. BUILD & PUSH DOCKER
  # ============================
  build-docker:
    needs: test-backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t minhavitrine-backend:latest ./backend
      - name: Save image
        run: docker save minhavitrine-backend:latest | gzip > minhavitrine-backend.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: minhavitrine-backend.tar.gz
          retention-days: 1

  # ============================
  # 3. DEPLOY NA AWS EC2
  # ============================
  deploy:
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload docker image
        run: |
          scp -i ~/.ssh/deploy_key minhavitrine-backend.tar.gz $EC2_USER@$EC2_HOST:/tmp/

      - name: Upload project files
        run: |
          scp -i ~/.ssh/deploy_key -r docker-compose.yml database/ nginx/ .env $EC2_USER@$EC2_HOST:/home/ubuntu/minhavitrine/

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'DEPLOY'
            cd /home/ubuntu/minhavitrine
            docker load < /tmp/minhavitrine-backend.tar.gz
            docker compose down
            docker compose up -d
            docker compose ps
            echo "✅ Deploy concluído em $(date)"
          DEPLOY

  # ============================
  # 4. BUILD APP MOBILE (EAS)
  # ============================
  build-mobile:
    needs: test-backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build Android
        run: cd frontend && eas build --platform android --profile production --non-interactive
      - name: Build iOS
        run: cd frontend && eas build --platform ios --profile production --non-interactive
